version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bureauos-postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-bureau_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-bureau_pass}
      - POSTGRES_DB=${DB_NAME:-bureau_db}
    ports:
      - '127.0.0.1:5439:5432'
    volumes:
      - bureauos_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: bureauos-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-bureauos_minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-bureauos_minio_secret}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - bureauos_minio_data:/data

volumes:
  bureauos_data:
  bureauos_minio_data:
